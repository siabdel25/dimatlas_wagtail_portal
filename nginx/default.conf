# Reverse-proxy TLS pour dimatlas_portal.
# Les statiques sont servis par WhiteNoise (dans gunicorn) ; nginx ne sert que
# /media/ et proxifie le reste. Adapter server_name + chemins de certs.

upstream web {
    server web:8000;
}

# HTTP → redirige vers HTTPS (sauf challenge ACME si Certbot webroot utilisé).
server {
    listen 80;
    server_name dimatlas.com www.dimatlas.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name dimatlas.com www.dimatlas.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    client_max_body_size 25M;

    # Médias uploadés (images Wagtail, documents).
    location /media/ {
        alias /srv/media/;
        expires 30d;
        access_log off;
    }

    # Filet de sécurité : statiques aussi servis par nginx si présents.
    location /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    location / {
        proxy_pass http://web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
